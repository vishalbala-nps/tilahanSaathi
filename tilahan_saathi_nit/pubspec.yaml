publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.4.0
  dio: ^5.6.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  intl: ^0.19.0
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
